<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>three.js calculator</title>
<style>
  html, body { margin:0; height:100%; background:#9db7cc; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #landscape-control { position:fixed; top:16px; left:16px; z-index:1; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; background:#18232de6; color:#fff; font-size:14px; box-shadow:0 2px 12px #0003; }
  #landscape { font:inherit; padding:6px 10px; border:1px solid #ffffff55; border-radius:6px; background:#fff; color:#18232d; }
  #landscape:focus-visible { outline:3px solid #ffbd62; outline-offset:3px; }
  #hint { position:fixed; left:0; right:0; bottom:16px; text-align:center; color:#ffffffcc; text-shadow:0 1px 3px #0006; font-size:12px; pointer-events:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="landscape-control"><label for="landscape">Landscape</label><select id="landscape"></select></div>
<div id="hint">Click the keys or use your keyboard (0–9 . + − × ÷ Enter Esc Backspace). Drag to orbit.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- calculator logic (no eval) ----------
const calc = {
  display: '0', acc: null, op: null, fresh: true,
  apply(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
    }
    return b;
  },
  format(n) {
    if (!isFinite(n)) return 'Error';
    const s = String(+n.toPrecision(12));
    return s.length > 12 ? n.toExponential(6) : s;
  },
  input(k) {
    if (this.display === 'Error' && k !== 'C') return;
    if (/^\d$/.test(k)) {
      if (this.fresh) { this.display = k; this.fresh = false; }
      else if (this.display.replace(/[-.]/g, '').length < 12) this.display = this.display === '0' ? k : this.display + k;
    } else if (k === '.') {
      if (this.fresh) { this.display = '0.'; this.fresh = false; }
      else if (!this.display.includes('.')) this.display += '.';
    } else if ('+−×÷'.includes(k)) {
      const v = parseFloat(this.display);
      if (this.op && !this.fresh) this.display = this.format(this.apply(this.acc, v, this.op));
      this.acc = parseFloat(this.display); this.op = k; this.fresh = true;
    } else if (k === '=') {
      if (this.op === null) return;
      this.display = this.format(this.apply(this.acc, parseFloat(this.display), this.op));
      this.acc = null; this.op = null; this.fresh = true;
    } else if (k === 'C') {
      Object.assign(this, { display: '0', acc: null, op: null, fresh: true });
    } else if (k === '±') {
      if (this.display !== '0') this.display = this.display.startsWith('-') ? this.display.slice(1) : '-' + this.display;
    } else if (k === '%') {
      this.display = this.format(parseFloat(this.display) / 100);
    } else if (k === '⌫') {
      if (!this.fresh) this.display = this.display.length > 1 ? this.display.slice(0, -1) : '0';
      if (this.display === '-') this.display = '0';
    }
    drawScreen();
  }
};
window.calc = calc; // handy for testing in the console

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color('#a9c3d6');
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 40, 120);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.up.set(0, 0, 1); // world is Z-up: terrain lies in the XY plane
camera.position.set(0, -21, 8.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 9; controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 0, 1.5);

const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(14, -10, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 });
scene.add(sun, new THREE.AmbientLight('#8899aa', 0.4));

// ---------- fractal mountains (diamond-square) ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function diamondSquare(n, roughness, seed) {
  const size = (1 << n) + 1, h = new Float32Array(size * size), rnd = mulberry32(seed);
  const at = (x, y) => h[y * size + x], set = (x, y, v) => { h[y * size + x] = v; };
  const r = () => rnd() * 2 - 1;
  [0, size - 1].forEach(x => [0, size - 1].forEach(y => set(x, y, r() * 0.3)));
  let amp = 1;
  for (let step = size - 1; step > 1; step >>= 1, amp *= roughness) {
    const half = step >> 1;
    for (let y = half; y < size; y += step)            // diamond step
      for (let x = half; x < size; x += step)
        set(x, y, (at(x - half, y - half) + at(x + half, y - half) + at(x - half, y + half) + at(x + half, y + half)) / 4 + r() * amp);
    for (let y = 0; y < size; y += half)               // square step
      for (let x = (y / half) % 2 === 0 ? half : 0; x < size; x += step) {
        let sum = 0, cnt = 0;
        for (const [dx, dy] of [[-half, 0], [half, 0], [0, -half], [0, half]]) {
          const xx = x + dx, yy = y + dy;
          if (xx >= 0 && xx < size && yy >= 0 && yy < size) { sum += at(xx, yy); cnt++; }
        }
        set(x, y, sum / cnt + r() * amp);
      }
  }
  return { h, size };
}

const LANDSCAPES = {
  mountains: {
    label: 'Mountains', sky: '#a9c3d6', sun: '#ffffff', water: -6.8, waterColor: '#4d86a8',
    palette: [[0, '#c9b98f'], [0.1, '#5f7f45'], [0.32, '#3f5a35'], [0.42, '#7a7068'], [0.5, '#f4f6f8']],
    height(x, y, noise) {
      const valley = THREE.MathUtils.smoothstep(Math.hypot(x, y) / 70, 0.05, 0.45);
      return -9 + Math.pow(noise, 1.35) * (0.25 + 0.75 * valley) * 26;
    },
    colorLevel: z => (z + 9) / 26
  },
  desert: {
    label: 'Desert', sky: '#e8c49b', sun: '#ffe0ad', water: null, waterColor: '#4d86a8',
    palette: [[0, '#a65e32'], [0.35, '#cf8c49'], [0.7, '#e8b96d'], [1, '#f7d998']],
    height(x, y, noise) {
      const dunes = Math.sin(x * 0.19 + Math.sin(y * 0.07) * 1.8);
      return -8 + (dunes * 0.5 + 0.5) * 4 + noise * 3;
    },
    colorLevel: z => (z + 8) / 7
  },
  seaside: {
    label: 'Seaside', sky: '#a8dce5', sun: '#fff6df', water: -6.4, waterColor: '#239eae',
    palette: [[0, '#568e88'], [0.25, '#d5bd87'], [0.48, '#f4dfa6'], [0.65, '#80a366'], [1, '#526c47']],
    height(x, y, noise) {
      const shore = x + 8 * Math.sin(y * 0.07) - 7;
      return -6.4 + shore * 0.10 + (noise - 0.45) * 2.2;
    },
    colorLevel: z => (z + 7.5) / 5
  }
};
const terrainSize = 140;
const { h, size: gridN } = diamondSquare(7, 0.56, 1337);
let lo = Infinity, hi = -Infinity;
for (const v of h) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, gridN - 1, gridN - 1);
const pos = terrainGeo.attributes.position;
const colors = new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3);
terrainGeo.setAttribute('color', colors);
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
terrain.receiveShadow = true;
scene.add(terrain);
const water = new THREE.Mesh(new THREE.PlaneGeometry(terrainSize, terrainSize),
  new THREE.MeshStandardMaterial({ roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.85 }));
water.receiveShadow = true;
scene.add(water);

function setLandscape(id) {
  const landscape = LANDSCAPES[id];
  const palette = landscape.palette.map(([level, color]) => [level, new THREE.Color(color)]);
  const color = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const z = landscape.height(pos.getX(i), pos.getY(i), (h[i] - lo) / (hi - lo));
    pos.setZ(i, z);
    const level = THREE.MathUtils.clamp(landscape.colorLevel(z), 0, 1);
    let upper = palette.findIndex(([stop]) => stop >= level);
    if (upper < 0) upper = palette.length - 1;
    const [end, endColor] = palette[upper];
    const [start, startColor] = palette[Math.max(0, upper - 1)];
    color.copy(startColor).lerp(endColor, end === start ? 0 : (level - start) / (end - start));
    colors.setXYZ(i, color.r, color.g, color.b);
  }
  pos.needsUpdate = true;
  colors.needsUpdate = true;
  terrainGeo.computeVertexNormals();
  terrainGeo.computeBoundingSphere();
  scene.background.set(landscape.sky);
  scene.fog.color.set(landscape.sky);
  sun.color.set(landscape.sun);
  water.visible = landscape.water !== null;
  water.position.z = landscape.water ?? 0;
  water.material.color.set(landscape.waterColor);
}
const landscapeSelect = document.getElementById('landscape');
for (const [id, landscape] of Object.entries(LANDSCAPES)) {
  landscapeSelect.add(new Option(landscape.label, id));
}
landscapeSelect.addEventListener('change', () => setLandscape(landscapeSelect.value));
setLandscape(landscapeSelect.value);

// everything belonging to the calculator lives in this floating rig
const rig = new THREE.Group();
rig.rotation.x = 0.55;               // tilt the face toward the camera
scene.add(rig);

// body
const body = new THREE.Mesh(
  new RoundedBoxGeometry(5.2, 7.6, 0.6, 6, 0.35),
  new THREE.MeshStandardMaterial({ color: '#23272e', metalness: 0.4, roughness: 0.45 })
);
body.castShadow = true; body.receiveShadow = true;
rig.add(body);

// screen (canvas texture)
const sc = document.createElement('canvas'); sc.width = 1024; sc.height = 256;
const sctx = sc.getContext('2d');
const screenTex = new THREE.CanvasTexture(sc); screenTex.colorSpace = THREE.SRGBColorSpace;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 1.12),
  new THREE.MeshBasicMaterial({ map: screenTex }));
screen.position.set(0, 2.85, 0.31);
rig.add(screen);

function drawScreen() {
  const g = sctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#c9dcc2'); g.addColorStop(1, '#a9c2a0');
  sctx.fillStyle = g; sctx.fillRect(0, 0, 1024, 256);
  sctx.fillStyle = '#2b3a2a';
  sctx.font = '500 58px ui-monospace, Menlo, monospace';
  sctx.textAlign = 'left';
  sctx.fillText(calc.op ? `${calc.format(calc.acc)} ${calc.op}` : '', 40, 78);
  const text = calc.display;
  let size = 150; sctx.font = `600 ${size}px ui-monospace, Menlo, monospace`;
  while (sctx.measureText(text).width > 940 && size > 40) { size -= 6; sctx.font = `600 ${size}px ui-monospace, Menlo, monospace`; }
  sctx.textAlign = 'right';
  sctx.fillText(text, 984, 220);
  screenTex.needsUpdate = true;
}

// keys
const LAYOUT = [
  ['C', '±', '%', '÷'],
  ['7', '8', '9', '×'],
  ['4', '5', '6', '−'],
  ['1', '2', '3', '+'],
  ['0', '.', '⌫', '='],
];
const COLORS = { num: '#e8e4dc', op: '#f08a24', fn: '#8e98a3', eq: '#2f9c82' };
const keyGeo = new RoundedBoxGeometry(1.0, 0.82, 0.35, 4, 0.14);
const keys = [];

function labelTexture(label, dark) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = dark ? '#1b1d21' : '#ffffff';
  x.font = '600 130px -apple-system, "Segoe UI", sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 128, 138);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

LAYOUT.forEach((row, r) => row.forEach((label, c) => {
  const kind = label === '=' ? 'eq' : '+−×÷'.includes(label) ? 'op' : 'C±%⌫'.includes(label) ? 'fn' : 'num';
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(keyGeo, new THREE.MeshStandardMaterial({ color: COLORS[kind], roughness: 0.45, metalness: 0.05 }));
  mesh.castShadow = true;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8),
    new THREE.MeshBasicMaterial({ map: labelTexture(label, kind !== 'eq'), transparent: true }));
  face.position.z = 0.176;
  group.add(mesh, face);
  group.position.set(-1.8 + c * 1.2, 1.55 - r * 1.0 - 0.15, 0.45);
  group.userData = { label, baseZ: 0.45, press: 0, mesh };
  mesh.userData.key = group; face.userData.key = group;
  rig.add(group); keys.push(group);
}));

// ---------- interaction ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hovered = null, downAt = null;
function pick(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(keys.flatMap(k => k.children))[0];
  return hit ? hit.object.userData.key : null;
}
function press(k) { k.userData.press = 1; calc.input(k.userData.label); }

renderer.domElement.addEventListener('pointermove', e => {
  hovered = pick(e);
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; // was a drag
  const k = pick(e); if (k) press(k);
});

const KEYMAP = { '*': '×', 'x': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', '=': '=',
  'Escape': 'C', 'c': 'C', 'Backspace': '⌫', '%': '%', '.': '.', ',': '.' };
addEventListener('keydown', e => {
  if (e.target.closest('select, input, textarea, button, [contenteditable]')) return;
  const label = /^\d$/.test(e.key) ? e.key : KEYMAP[e.key];
  const k = keys.find(k => k.userData.label === label);
  if (k) { e.preventDefault(); press(k); }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
const clock = new THREE.Clock();
drawScreen();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const k of keys) {
    const u = k.userData;
    u.press = Math.max(0, u.press - dt * 6);
    const target = u.baseZ - 0.18 * Math.sin(u.press * Math.PI) + (k === hovered ? 0.06 : 0);
    k.position.z += (target - k.position.z) * Math.min(1, dt * 20);
    u.mesh.material.emissive.setScalar(k === hovered ? 0.08 : 0);
  }
  const t = clock.elapsedTime;
  rig.position.z = 1.5 + Math.sin(t * 1.1) * 0.25;   // float
  rig.rotation.z = Math.sin(t * 0.4) * 0.06;
  rig.rotation.y = Math.sin(t * 0.7) * 0.03;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
